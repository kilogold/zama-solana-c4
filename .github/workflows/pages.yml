name: Publish Structurizr site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Structurizr version as the local install, so the site matches what we review.
      - name: Export static site
        run: |
          docker run --rm -v "$PWD:/usr/local/structurizr" structurizr/structurizr:2026.06.28 \
            export -w /usr/local/structurizr/workspace.dsl -f static -o /usr/local/structurizr/site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
